<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="avatar-title">
  <title id="avatar-title">Michael Attias</title>
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.45" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="av-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="av-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CFAB"/>
      <stop offset="1" stop-color="#EAB68E"/>
    </linearGradient>
    <clipPath id="av-frame"><circle cx="200" cy="200" r="200"/></clipPath>
    <clipPath id="av-head"><circle cx="200" cy="168" r="74"/></clipPath>
  </defs>

  <g clip-path="url(#av-frame)">
    <rect width="400" height="400" fill="url(#av-bg)"/>
    <circle cx="96" cy="74" r="140" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="330" cy="340" r="160" fill="#1E1B4B" opacity="0.18"/>

    <!-- shoulders -->
    <ellipse cx="200" cy="432" rx="154" ry="162" fill="url(#av-shirt)"/>
    <path d="M168 280 200 332 232 280 216 271 200 300 184 271Z" fill="#6366F1" opacity="0.92"/>

    <!-- neck -->
    <path d="M172 214h56v56a28 28 0 0 1-56 0z" fill="#E0A177"/>

    <!-- head -->
    <circle cx="200" cy="168" r="74" fill="url(#av-skin)"/>
    <circle cx="126" cy="176" r="13" fill="#E0A177"/>
    <circle cx="274" cy="176" r="13" fill="#E0A177"/>

    <!-- hair -->
    <g clip-path="url(#av-head)" fill="#2A2438">
      <ellipse cx="200" cy="98" rx="86" ry="54"/>
      <rect x="126" y="96" width="26" height="92"/>
      <rect x="248" y="96" width="26" height="92"/>
    </g>

    <!-- brows -->
    <g fill="none" stroke="#2A2438" stroke-width="6" stroke-linecap="round">
      <path d="M164 155q12-7 24-1"/>
      <path d="M212 154q12-6 24 1"/>
    </g>

    <!-- eyes -->
    <ellipse cx="177" cy="177" rx="6.5" ry="7.5" fill="#2A2438"/>
    <ellipse cx="223" cy="177" rx="6.5" ry="7.5" fill="#2A2438"/>

    <!-- glasses -->
    <g fill="none" stroke="#151A2E" stroke-width="5" opacity="0.88">
      <rect x="155" y="162" width="44" height="30" rx="11"/>
      <rect x="201" y="162" width="44" height="30" rx="11"/>
      <path d="M199 176h2"/>
      <path d="M155 172h-22"/>
      <path d="M245 172h22"/>
    </g>

    <!-- nose + mouth -->
    <path d="M200 192v11q0 5 6 5" fill="none" stroke="#D2865C" stroke-width="4" stroke-linecap="round"/>
    <path d="M186 215q14 12 28 0" fill="none" stroke="#BE6A54" stroke-width="5" stroke-linecap="round"/>

    <!-- frame ring -->
    <circle cx="200" cy="200" r="195" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10"/>
  </g>
</svg>
